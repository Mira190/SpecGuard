# Template for the only file on a mirror repo's default branch (docs/traceability-plan.md §7.4.1).
# run.js --external adds it as commit W on top of each historical base. Replace OWNER and SHA with the SpecGuard commit under test.
# Repo variables: SPECGUARD_EVAL_MODEL (model, empty = engine default), SPECGUARD_EVAL_TRACE (off | auto, set per run by run.js).
name: specguard-eval
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
  issues: read
  copilot-requests: write
jobs:
  dogfood:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: OWNER/specguard@SHA
        with:
          review_timeout_minutes: "20"
          model: "${{ vars.SPECGUARD_EVAL_MODEL }}"
          trace: "${{ vars.SPECGUARD_EVAL_TRACE || 'auto' }}"
          max_comments: "${{ vars.SPECGUARD_EVAL_MAX_COMMENTS || '10' }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with: { name: specguard-ctx, path: .specguard-ctx/, retention-days: 7, include-hidden-files: true }
