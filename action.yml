name: SpecGuard
description: Requirement-aware PR reviewer that finds missing and weak unit tests and checks the repo's own coding standards.
branding: { icon: shield, color: blue }

inputs:
  engine: { description: "Review engine adapter: auto (default: by the credential kind when llm_token is set, else copilot on the job token) | copilot (Copilot CLI) | claude (Claude Code CLI on an Anthropic API key). Each engine is one script in src/engines/ (see src/engines/README.md).", default: auto }
  llm_token: { description: "The model credential, detected by prefix and never printed: a GitHub fine-grained PAT with Copilot Requests (github_pat_..., gho_..., ghu_...) runs the copilot engine; an Anthropic API key (sk-ant-...) runs the claude engine. Classic ghp_ tokens and other values fail. Empty = copilot on the job token with permissions copilot-requests write (org billing).", default: "" }
  copilot_token: { description: "Alias of llm_token (llm_token wins when both are set).", default: "" }
  github_token: { description: "Token for collect and post (needs pull-requests write).", default: "${{ github.token }}" }
  model: { description: "Model name passed to the engine. Empty = Copilot Auto (copilot) or the CLI default (claude). Short alias: haiku-5.5. Any full id passes through. What is available depends on the token owner's plan; with Copilot an unavailable model falls back to auto.", default: "" }
  effort: { description: "Reasoning effort: empty (Copilot default) | low | medium | high | xhigh | max. Only passed with an explicit model other than auto.", default: "" }
  auto_tier: { description: "Copilot Auto routing profile when model is empty or auto: intelligence | balance | efficiency | empty (Copilot default). Ignored, with a note, if the CLI or an org policy rejects it.", default: intelligence }
  fast_models: { description: "Copilot: extra model names (exact, or /regex/; one per line or comma separated) to treat as fast-tier on top of the built-in name patterns (flash, mini, haiku, nano, lite, small).", default: "" }
  copilot_max_ai_credits: { description: "Copilot soft cap on AI credits per turn (integer 30-2000). A Copilot run is one turn plus at most one repair turn on the same session, so the worst case per push is about twice this.", default: "60" }
  max_budget_usd: { description: "claude engine: the budget in USD per run (positive decimal, at most 20). In api mode (default) it is a HARD bound: the worst-case cost (prompt size plus max_output_tokens at the model's price) is computed before the call and the call is not made when it exceeds this. In agent mode it is the Claude Code CLI's soft cap (checked between turns; a run can cost several times this) plus a finalize turn of 20% of it. Ignored by the copilot engine.", default: "1.00" }
  claude_mode: { description: "claude engine: api (default; ONE Anthropic Messages API call with the context SpecGuard already built, schema-enforced JSON, cost bounded up front by max_budget_usd, no CLI install) | agent (Claude Code CLI with read-only tools; the tool loop re-sends the whole context every turn, so cost is not bounded up front). Ignored by the copilot engine.", default: api }
  max_output_tokens: { description: "claude engine, api mode: most output tokens the model may produce (integer 1000-64000). Part of the worst-case cost checked against max_budget_usd.", default: "16000" }
  max_comments: { description: "Max inline comments (hard cap 30).", default: "10" }
  max_diff_kb: { description: "Diff size above which the review is partial.", default: "300" }
  focus_threshold: { description: "Advanced. Large-PR gate as 'lines,files' (default '600,25'; 'off' disables). Above it only the highest-risk changed files are reviewed and the summary says so.", default: "600,25" }
  focus_files: { description: "Advanced. Most files a focused (large-PR) review covers, riskiest first (default 12).", default: "12" }
  ignore: { description: "Extra ignore globs, one per line, appended to the defaults.", default: "" }
  standards_checks: { description: "Exact check:NAME or status:CONTEXT entries, one per line. Requires checks/statuses read permission. Empty means not configured.", default: "" }
  standards_ref: { description: "head or merge: commit on which your lint/format jobs run. Defaults to head.", default: head }
  requirements_paths: { description: "Globs (one per line) that add requirement documents; a !glob line excludes. Empty = content-based discovery only.", default: "" }
  test_paths: { description: "Globs or folders (one per line; a !glob line excludes) that are the authoritative unit-test locations. Empty = discover test files by name and layout.", default: "" }
  standards_paths: { description: "Globs (one per line) that add coding-standard or review-guideline documents, read from the base commit; a !glob line excludes.", default: "" }
  coverage_files: { description: "Optional. Coverage report globs, one per line, relative to the workspace (LCOV, Cobertura XML, JaCoCo XML, Go cover profile, Istanbul coverage-final.json). SpecGuard never runs tests: your workflow must run them with coverage BEFORE this step, in the same job. With a report, changed lines that no test executed are reported as facts and a 'covered' judgement for such a line is downgraded. Empty = off.", default: "" }
  trace: { description: "auto | off. auto traces requirement docs and code when any requirement doc is found.", default: auto }
  claude_version: { description: "Pinned @anthropic-ai/claude-code version (claude engine).", default: "2.1.284" }
  copilot_version: { description: "Pinned @github/copilot version (>= 1.0.85).", default: "1.0.92" }
  review_timeout_minutes: { description: "Engine time limit in minutes. Keep the job timeout-minutes at least 3 above it.", default: "12" }
  include_bots: { description: "true to review PRs opened by bots (skipped by default).", default: "false" }
  resolve_stale: { description: "true to resolve SpecGuard's own unreplied review threads whose finding is no longer reported. Needs a token that can resolve review threads (the job token cannot).", default: "false" }
  force: { description: "true to review again although this head SHA already has a SpecGuard summary.", default: "false" }
  ctx_retention_days: { description: "Days to keep the specguard-ctx debug artifact (diff, prompt context, raw engine output; repo readers can download it). 0 disables the upload.", default: "1" }
  mode: { description: "pr (review a pull request) | scan (unit test gap scan: find behaviour in the design documents of the checked-out repository that lacks unit-test evidence; run it on the default branch, on demand or on a schedule). audit is accepted as an alias of scan.", default: pr }
  scan_max_blocks: { description: "Scan mode: most document blocks audited per run (integer 1-500; empty = 80). With scan_issue: true the runs rotate through all blocks (changed documents, gaps to confirm, never-audited blocks, then the least recently audited); without it the first blocks in document order.", default: "" }
  scan_paths: { description: "Scan mode: newline-separated globs (! excludes) that restrict both the requirement documents and the code and tests searched for evidence to a subtree, for a monorepo package (empty = the whole repository). The scan issue is per scope.", default: "" }
  scan_issue: { description: "Scan mode: true to also create or update one issue titled 'SpecGuard: unit test gap scan' (with scan_paths: '... (<scope>)'; with scan_issue_repo: '...: owner/name', before the scope; needs issues write; empty = false). It holds the state that lets runs confirm gaps and rotate through all blocks.", default: "" }
  scan_issue_repo: { description: "Scan mode with scan_issue: owner/name of the repository that holds the scan issue (title ends with the scanned repository). Empty = the scanned repository. For a manual run that scans another repository and keeps its state in this one.", default: "" }
  scan_issue_token: { description: "Token for that issue (issues write on scan_issue_repo). Empty = github_token.", default: "" }
  audit_max_requirements: { description: "Deprecated alias of scan_max_blocks (scan_max_blocks wins when both are set).", default: "" }
  audit_issue: { description: "Deprecated alias of scan_issue (scan_issue wins when both are set).", default: "" }
  delivery: { description: "pr (post the review and the summary comment to the PR) | summary (job summary only; nothing is written to the PR). For runs that review another repository (.github/workflows/specguard-run.yml).", default: pr }
  fail_on_error: { description: "true to fail the job when SpecGuard could not complete (status failed: engine error, quota, timeout, unusable output); an incomplete result only warns. Default false: SpecGuard is advisory and never fails a PR check. Manual runs set it.", default: "false" }
  repository: { description: "owner/name of the repository under review when the checkout is not the workflow's own repository (manual runs). Empty = the workflow's repository.", default: "" }
  pr_number: { description: "PR number to review when the run is not a pull_request event (manual runs). Empty = the event's PR.", default: "" }
  base_sha: { description: "Base commit of that PR (with pr_number). Empty = the event's.", default: "" }
  head_sha: { description: "Head commit of that PR (with pr_number). Empty = the event's.", default: "" }

outputs:
  skip: { description: "true when nothing reviewable changed", value: "${{ steps.preflight.outputs.skip == 'true' && 'true' || steps.collect.outputs.skip }}" }
  status: { description: "complete | incomplete | failed (PR review and scan); empty when skipped", value: "${{ steps.post.outputs.status || steps.scan_post.outputs.status }}" }
  partial: { description: "true when the diff was truncated", value: "${{ steps.collect.outputs.partial }}" }
  superseded: { description: "true when a newer commit was pushed (or the PR closed) before the model was called; the review was skipped and no AI credits were spent", value: "${{ steps.superseded.outputs.superseded }}" }

runs:
  using: composite
  steps:
    - name: Refuse env that loads repo hooks or MCP
      shell: bash
      run: |
        if env | grep -qE '^(COPILOT_ALLOW_ALL|GITHUB_COPILOT_PROMPT_MODE_[A-Za-z0-9_]*)='; then
          echo "::error::COPILOT_ALLOW_ALL / GITHUB_COPILOT_PROMPT_MODE_* must not be set: they load repo hooks and MCP servers"
          exit 1
        fi

    - name: Check mode
      id: mode
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        EVENT: ${{ github.event_name }}
      run: |
        case "$MODE" in pr) m=pr ;; scan|audit) m=scan ;; *) echo "::error::mode must be pr or scan (audit is an alias of scan)"; exit 1 ;; esac
        echo "mode=$m" >> "$GITHUB_OUTPUT" # the canonical name: later steps test this, never inputs.mode
        # scan trusts the checked-out docs as the oracle: never a PR head
        [ "$m" != scan ] || case "$EVENT" in pull_request*) echo "::error::mode scan runs on workflow_dispatch or schedule, not on pull_request"; exit 1 ;; esac

    # Closed PR, bot author or an already-reviewed head: skip before any model tokens are spent; the job stays green.
    - id: preflight
      if: inputs.mode == 'pr'
      shell: bash
      env:
        HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
        PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        GH_TOKEN: ${{ inputs.github_token }}
        GH_REPO: ${{ inputs.repository || github.repository }}
        INCLUDE_BOTS: ${{ inputs.include_bots }}
        FORCE: ${{ inputs.force }}
      run: node "$GITHUB_ACTION_PATH/src/preflight.js"

    - id: collect
      if: inputs.mode == 'pr' && steps.preflight.outputs.skip != 'true'
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
        PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        GH_TOKEN: ${{ inputs.github_token }}
        GH_REPO: ${{ inputs.repository || github.repository }}
        CTX: ${{ github.workspace }}/.specguard-ctx
        IGNORE_EXTRA: ${{ inputs.ignore }}
        MAX_DIFF_KB: ${{ inputs.max_diff_kb }}
        FOCUS_THRESHOLD: ${{ inputs.focus_threshold }}
        FOCUS_FILES: ${{ inputs.focus_files }}
        REQ_PATHS: ${{ inputs.requirements_paths }}
        STANDARDS_PATHS: ${{ inputs.standards_paths }}
        TEST_PATHS: ${{ inputs.test_paths }}
        TRACE: ${{ inputs.trace }}
      run: bash "$GITHUB_ACTION_PATH/src/collect.sh"

    # A push that landed while collecting context makes this run stale: skip the engine and post, no AI credits spent. Fails open on API errors.
    - id: superseded
      if: inputs.mode == 'pr' && steps.preflight.outputs.skip != 'true' && steps.collect.outputs.skip != 'true'
      shell: bash
      env:
        HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
        PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        GH_TOKEN: ${{ inputs.github_token }}
        GH_REPO: ${{ inputs.repository || github.repository }}
      run: node "$GITHUB_ACTION_PATH/src/superseded.js"

    # Scan mode: design documents, rule files and test layout at the checked-out HEAD (src/audit-collect.js).
    - id: audit_collect
      if: steps.mode.outputs.mode == 'scan'
      shell: bash
      env:
        CTX: ${{ github.workspace }}/.specguard-ctx
        IGNORE_EXTRA: ${{ inputs.ignore }}
        REQ_PATHS: ${{ inputs.requirements_paths }}
        STANDARDS_PATHS: ${{ inputs.standards_paths }}
        TEST_PATHS: ${{ inputs.test_paths }}
        SCAN_MAX_BLOCKS: ${{ inputs.scan_max_blocks }}
        SCAN_PATHS: ${{ inputs.scan_paths }}
        SCAN_ISSUE: ${{ inputs.scan_issue }}
        AUDIT_ISSUE: ${{ inputs.audit_issue }} # deprecated alias; the new name wins
        GH_TOKEN: ${{ inputs.github_token }} # reads the scan issue's state (scan_issue: true)
        GH_REPO: ${{ inputs.repository || github.repository }}
        MAX_REQUIREMENTS: ${{ inputs.audit_max_requirements }} # deprecated alias; the new name wins
        AUDIT_BRANCH_GUARD: ${{ inputs.repository && inputs.repository != github.repository && 'off' || 'on' }} # the guard compares this workflow's ref; another repository is not on it
      run: node "$GITHUB_ACTION_PATH/src/audit-collect.js"

    - if: (inputs.mode == 'pr' && steps.preflight.outputs.skip != 'true' && steps.collect.outputs.skip != 'true') || (steps.mode.outputs.mode == 'scan' && steps.audit_collect.outputs.skip != 'true')
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22

    # Optional execution evidence: the target workflow ran its tests with coverage before this step (src/coverage.js). Never fails the job.
    - id: coverage
      if: inputs.mode == 'pr' && inputs.coverage_files != '' && steps.preflight.outputs.skip != 'true' && steps.collect.outputs.skip != 'true' && steps.superseded.outputs.superseded != 'true'
      continue-on-error: true
      shell: bash
      env:
        CTX: ${{ github.workspace }}/.specguard-ctx
        COVERAGE_FILES: ${{ inputs.coverage_files }}
        HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
      run: node "$GITHUB_ACTION_PATH/src/coverage.js" || true

    # What the credential is (by prefix; the value is never printed), which engine it selects and the model's real name.
    - id: credential
      if: (inputs.mode == 'pr' && steps.preflight.outputs.skip != 'true' && steps.collect.outputs.skip != 'true' && steps.superseded.outputs.superseded != 'true') || (steps.mode.outputs.mode == 'scan' && steps.audit_collect.outputs.skip != 'true')
      shell: bash
      env:
        LLM_TOKEN: ${{ inputs.llm_token || inputs.copilot_token }}
        ENGINE: ${{ inputs.engine }}
        MODEL: ${{ inputs.model }}
      run: node "$GITHUB_ACTION_PATH/src/credential.js"

    - id: engine
      if: (inputs.mode == 'pr' && steps.preflight.outputs.skip != 'true' && steps.collect.outputs.skip != 'true' && steps.superseded.outputs.superseded != 'true') || (steps.mode.outputs.mode == 'scan' && steps.audit_collect.outputs.skip != 'true')
      shell: bash
      env:
        ENGINE: ${{ steps.credential.outputs.engine }}
        COPILOT_VERSION: ${{ inputs.copilot_version }}
        CLAUDE_VERSION: ${{ inputs.claude_version }}
        MODEL: ${{ steps.credential.outputs.model }}
        EFFORT: ${{ inputs.effort }}
        AUTO_TIER: ${{ inputs.auto_tier }}
        FAST_MODELS: ${{ inputs.fast_models }}
        MAX_CREDITS: ${{ inputs.copilot_max_ai_credits }}
        MAX_BUDGET_USD: ${{ inputs.max_budget_usd }}
        CLAUDE_MODE: ${{ inputs.claude_mode }}
        MAX_OUTPUT_TOKENS: ${{ inputs.max_output_tokens }}
        TIMEOUT: ${{ inputs.review_timeout_minutes }}
      run: |
        bash "$GITHUB_ACTION_PATH/src/validate-inputs.sh" || exit 1 # includes the engine allow-list
        echo "engine=$ENGINE" >> "$GITHUB_OUTPUT"

    # The engine step never fails the job: post reports "could not complete" instead. Config errors above fail loudly.
    - name: Run the review engine
      if: (inputs.mode == 'pr' && steps.preflight.outputs.skip != 'true' && steps.collect.outputs.skip != 'true' && steps.superseded.outputs.superseded != 'true') || (steps.mode.outputs.mode == 'scan' && steps.audit_collect.outputs.skip != 'true')
      shell: bash
      env:
        ENGINE: ${{ steps.engine.outputs.engine }}
        COPILOT_GITHUB_TOKEN: ${{ steps.credential.outputs.kind != 'anthropic' && (inputs.llm_token || inputs.copilot_token) || '' }}
        ANTHROPIC_API_KEY: ${{ steps.credential.outputs.kind == 'anthropic' && (inputs.llm_token || inputs.copilot_token) || '' }}
        GITHUB_TOKEN: ${{ github.token }}
        MODE: ${{ steps.mode.outputs.mode }}
        CHECK: ${{ steps.mode.outputs.mode == 'scan' && 'audit' || '' }}
        CTX: ${{ github.workspace }}/.specguard-ctx
        COPILOT_VERSION: ${{ inputs.copilot_version }}
        CLAUDE_VERSION: ${{ inputs.claude_version }}
        MODEL: ${{ steps.credential.outputs.model }}
        EFFORT: ${{ inputs.effort }}
        AUTO_TIER: ${{ inputs.auto_tier }}
        FAST_MODELS: ${{ inputs.fast_models }}
        MAX_CREDITS: ${{ inputs.copilot_max_ai_credits }}
        MAX_BUDGET_USD: ${{ inputs.max_budget_usd }}
        CLAUDE_MODE: ${{ inputs.claude_mode }}
        MAX_OUTPUT_TOKENS: ${{ inputs.max_output_tokens }}
        TIMEOUT: ${{ inputs.review_timeout_minutes }}
      run: |
        if [ "$MODE" = scan ]; then skill="$GITHUB_ACTION_PATH/skills/spec-audit"; schema_file="$GITHUB_ACTION_PATH/src/audit.schema.json"
        else skill="$GITHUB_ACTION_PATH/skills/test-review"; schema_file="$GITHUB_ACTION_PATH/src/findings.schema.json"; fi
        # the model can only read the workspace, so inline the skill, the references that can matter and the per-PR context (src/prompt.js)
        # a file, handed to the engine: the prompt is too big for one argument or environment variable (128 KiB on Linux)
        PROMPT_FILE="$CTX/prompt.txt"
        node "$GITHUB_ACTION_PATH/src/prompt.js" --skill "$skill" --ctx "$CTX" --schema "$schema_file" --mode "$MODE" > "$PROMPT_FILE" || { echo "::warning::could not assemble the review prompt"; echo failed > "$CTX/engine-status"; exit 0; }
        # src/engines/<engine>.sh owns the install, the time budget, the model fallback and the safety flags (contract: src/engines/README.md)
        PROMPT_FILE="$PROMPT_FILE" bash "$GITHUB_ACTION_PATH/src/engines/$ENGINE.sh" || exit 1
        exit 0

    - id: post
      if: ${{ !cancelled() && inputs.mode == 'pr' && steps.preflight.outputs.skip != 'true' && steps.superseded.outputs.superseded != 'true' }} # failures still report; a cancelled run (superseded push) posts nothing
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        CTX: ${{ github.workspace }}/.specguard-ctx
        MAX_COMMENTS: ${{ inputs.max_comments }}
        RESOLVE_STALE: ${{ inputs.resolve_stale }}
        ENGINE: ${{ steps.engine.outputs.engine }}
        MODEL: ${{ steps.credential.outputs.model }}
        SKIP: ${{ steps.collect.outputs.skip }}
        PARTIAL: ${{ steps.collect.outputs.partial }}
        HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
        BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha }}
        TARGET_REPO: ${{ inputs.repository }}
        TARGET_PR: ${{ inputs.pr_number }}
        DELIVERY: ${{ inputs.delivery }}
        STANDARDS_CHECKS: ${{ inputs.standards_checks }}
        STANDARDS_REF: ${{ inputs.standards_ref }}
        REVIEW_TIMEOUT_MINUTES: ${{ inputs.review_timeout_minutes }}
      with:
        github-token: ${{ inputs.github_token }}
        retries: 3 # GitHub API 5xx (e.g. "diff temporarily unavailable") would otherwise drop the review
        script: |
          const env = process.env, t = require(env.ACTION_PATH + '/src/target.js')
          // manual runs: the PR and repository come from inputs, not the event; delivery=summary also makes every write fail (a safety net beside post.js's own DELIVERY switch)
          await require(env.ACTION_PATH + '/src/post.js')({ github: env.DELIVERY === 'summary' ? t.readOnly(github) : github, context: t.withTarget(context, env), core })

    - if: ${{ !cancelled() && inputs.mode == 'pr' && steps.preflight.outputs.skip != 'true' && inputs.ctx_retention_days != '0' }} # raw engine output otherwise dies with the runner
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: specguard-ctx-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: ${{ github.workspace }}/.specguard-ctx
        retention-days: ${{ inputs.ctx_retention_days }}
        if-no-files-found: ignore
        include-hidden-files: true # the ctx dir is a dot-directory, which upload-artifact skips by default

    # Scan mode: validate citations at HEAD, write the job summary (and with scan_issue the one scan issue), keep audit.json in the artifact.
    - id: scan_post
      if: ${{ !cancelled() && steps.mode.outputs.mode == 'scan' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        CTX: ${{ github.workspace }}/.specguard-ctx
        ENGINE: ${{ steps.engine.outputs.engine }}
        MODEL: ${{ steps.credential.outputs.model }}
        SKIP: ${{ steps.audit_collect.outputs.skip }}
        SCAN_ISSUE: ${{ inputs.scan_issue }}
        SCAN_PATHS: ${{ inputs.scan_paths }}
        AUDIT_ISSUE: ${{ inputs.audit_issue }} # deprecated alias; the new name wins
        TARGET_REPO: ${{ inputs.repository }}
        TARGET_SHA: ${{ inputs.head_sha }}
        ISSUE_REPO: ${{ inputs.scan_issue_repo }}
        ISSUE_TOKEN: ${{ inputs.scan_issue_token }}
      with:
        github-token: ${{ inputs.github_token }}
        retries: 3
        script: |
          const env = process.env
          // the scan issue may live in another repository (scan_issue_repo) under its own token; every read of the scanned repository uses github_token
          await require(env.ACTION_PATH + '/src/audit-post.js')({ github, issueGithub: env.ISSUE_TOKEN ? getOctokit(env.ISSUE_TOKEN) : github, context: require(env.ACTION_PATH + '/src/target.js').withTarget(context, env), core })

    - if: ${{ !cancelled() && steps.mode.outputs.mode == 'scan' && inputs.ctx_retention_days != '0' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: specguard-audit-${{ github.run_attempt }}
        path: ${{ github.workspace }}/.specguard-ctx
        retention-days: ${{ inputs.ctx_retention_days }}
        if-no-files-found: ignore
        include-hidden-files: true

    # fail_on_error: a manual run that could not complete must not look green (the steps above never fail the job).
    - if: ${{ !cancelled() && inputs.fail_on_error == 'true' }}
      shell: bash
      env:
        STATUS: ${{ steps.post.outputs.status || steps.scan_post.outputs.status }}
        REASON: ${{ steps.post.outputs.reason || steps.scan_post.outputs.reason }}
      run: node "$GITHUB_ACTION_PATH/src/fail-on-error.js"
