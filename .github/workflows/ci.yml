name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push: { branches: [main] }
# `edited` (a PR title/body/base edit) re-runs the dogfood review so new acceptance criteria are checked; preflight skips it unless the title/body fingerprint changed. Its own concurrency group (action appended) keeps a body edit from cancelling a push's running test job, and a push from cancelling the edit's review (that one re-runs on the next push anyway).
concurrency: { group: "ci-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'edited' && '-edited' || '' }}", cancel-in-progress: true }
permissions:
  contents: read
  pull-requests: write
  issues: read
  copilot-requests: write
jobs:
  test:
    if: ${{ github.event.action != 'edited' || github.event.changes.base != null }} # a title/body edit changes no code; a base retarget changes the merge result
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - run: node --test src/*.test.js bin/*.test.js eval/*.test.js eval/trace-recall/*.test.js $(find eval-sandbox -name "*.test.js" 2>/dev/null) # sandbox tests exist only on eval PRs; never run eval/cases fixtures
      - run: node bin/leak-check.js # detects honey markers, local user paths and (if the secret is set) denylisted private names in tracked files
        env: { SPECGUARD_DENY_SHA256: "${{ secrets.SPECGUARD_DENY_SHA256 }}" }
      # history was rewritten 2026-10-19 (two private files and local user paths removed): scan the commits this change adds, and refuse any history that still has the removed files
      - run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            git fetch --no-tags origin "${{ github.base_ref }}" && range="origin/${{ github.base_ref }}..HEAD"
          elif [ "${{ github.event.before }}" != 0000000000000000000000000000000000000000 ]; then range="${{ github.event.before }}..${{ github.sha }}"; fi
          [ -z "$range" ] || git log -p -U0 --cc --format= "$range" | node bin/leak-check.js --stdin
          [ -z "$(git log --format=%H -1 -- docs/shift-left-live-review-evidence-2026-10-17.json docs/latest-pr-actions-followup-evidence-2026-10-17.json)" ] || { echo "pre-rewrite history detected: rebase onto the current origin/main (history was rewritten 2026-10-19)"; exit 1; }
        env: { SPECGUARD_DENY_SHA256: "${{ secrets.SPECGUARD_DENY_SHA256 }}" }
      - run: diff -r skills/test-review .github/skills/test-review && diff ccr/test-review.instructions.md .github/instructions/test-review.instructions.md
  dogfood:
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: ./
        with:
          review_timeout_minutes: "15"
          ignore: eval/cases/
          # content-based discovery would otherwise index this repo's own docs and eval fixtures; only eval-sandbox/** is a requirement source here. A leading / anchors at the repo root: a bare !docs/** would also exclude eval-sandbox/*/docs/.
          requirements_paths: |
            !/docs/**
            !/eval/**
            !/research/**
            !/README.md
            !/skills/**
            !/.github/**
            !/ccr/**
          # eval PRs (branch eval/*): the candidate tests come from eval-sandbox only, not this repo's own src/bin/eval tests (a normal PR keeps them)
          test_paths: |
            ${{ startsWith(github.head_ref, 'eval/') && '!/src/
            !/bin/
            !/eval/
            !/skills/' || '' }}
          # TEMPORARY test credential and model (the Copilot quota is used up): remove `|| secrets.SPEC` and the model pin when done (model back to `${{ vars.SPECGUARD_EVAL_MODEL }}`)
          llm_token: ${{ secrets.SPECGUARD_LLM_TOKEN || secrets.SPEC }}
          model: haiku-5.5
          max_comments: "${{ vars.SPECGUARD_EVAL_MAX_COMMENTS || '10' }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with: { name: specguard-ctx, path: .specguard-ctx/, retention-days: 7, include-hidden-files: true }
