name: SpecGuard manual run
# Run SpecGuard on demand against ANOTHER repository (README: "Manual run (SpecGuard repo)"). This workflow lives in the SpecGuard repo only; it is not shipped to target repos.
# One required input: a PR link reviews that PR; a repo link, owner/name or a branch link runs the unit test gap scan of that branch (default branch when none). Model and effort are Copilot Auto (auto_tier intelligence).
# The secret SPECGUARD_PAT (a fine-grained PAT with Contents, Issues and Pull requests read on the target repositories; Pull requests write only for post_to_pr) belongs in the ENVIRONMENT secret store of
# the environment "specguard" (REQUIREMENT: restrict its deployment branches to main, so only code from main sees the secrets; not enforced by this file), never in the repository secrets: both jobs run in that environment and nothing else in this file reads the secret. Without it the job token is
# used, which reads only this repository and public ones.
# Scans keep their state (two-run confirmation) in an issue: scan_issue specguard = one issue per scanned repository in THIS repository, written with the job token (issues: write on the review job);
# the quoted code and requirement text then sit in this repository, so keep it private with access no wider than the targets' (enforced: the resolve job fails a non-public target when this repository is public). target = the issue in the scanned repository (token needs Issues write there).
# Copilot token: SPECGUARD_COPILOT_TOKEN (environment secret) = a fine-grained PAT OWNED BY A USER (resource owner = the user, account permission "Copilot Requests"; classic ghp_ and org-owned tokens are rejected).
# It is a different token from SPECGUARD_PAT (org-owned, repository read): one fine-grained PAT has a single resource owner, so it cannot carry both. Usage is billed to that user's Copilot seat. Empty = the job token
# with copilot-requests: write, which works only when the organization enables "Allow use of Copilot CLI billed to the organization".
# Token order: GitHub App installation token (environment secrets SPECGUARD_APP_ID = the App's Client ID or App ID, and SPECGUARD_APP_PRIVATE_KEY; minted per job, scoped to the one target repository, read-only
# unless post_to_pr or scan_issue: target), else SPECGUARD_PAT, else the job token (repository access only; Copilot has its own token above). The App needs Contents, Pull requests and Issues read (Pull requests write for post_to_pr) and must be installed on the target repository.
on:
  workflow_dispatch:
    inputs:
      target: { description: "A PR link (reviews it), a repository link, or a branch or directory link (scans it; a directory limits the scan to the source files under it). GitHub's 'Use workflow from' picks the SpecGuard version that runs; the code reviewed comes from here.", required: true, type: string }
      design_docs: { description: "Design documents to check against: paths, globs or links in that repo, one per line. Empty = found automatically.", required: false, type: string }
      rules_docs: { description: "Coding-standard documents, same format. Empty = found automatically.", required: false, type: string }
      test_dirs: { description: "Unit-test folders, same format. Empty = found automatically.", required: false, type: string }
      post_to_pr: { description: "PR links only: also post the review on the PR. Off = results stay on this run page.", required: false, type: boolean, default: false }
      model: { description: "Model name passed to the engine (short alias haiku-5.5 or a full id).", required: false, type: string, default: "haiku-5.5" }
      max_budget_usd: { description: "Claude engine: hard budget in USD per run, at most 20. Empty = the action default (1.00).", required: false, type: string, default: "" }
      scan_scope: { description: "Scans only: all = review the whole repository in this one run (every unit part and document block, claude engine; incomplete and red when the budget or the time limit stops it, so set max_budget_usd); selected = the riskiest units and the first blocks one run's caps allow.", required: false, type: choice, default: all, options: [all, selected] }
      scan_issue: { description: "Scans only: where the scan's results are kept. none = this run's page only; specguard = a tracking issue in this repository; target = an issue in the scanned repository. This repository is public, so its run pages and issues are visible to anyone.", required: false, type: choice, default: none, options: [specguard, target, none] }
permissions: {}
concurrency: { group: "specguard-run-${{ inputs.target }}", cancel-in-progress: false }

jobs:
  # Inputs -> repository paths and PR commits. A separate job: the review job checks the target out at the workspace root, which would wipe this checkout.
  resolve:
    runs-on: ubuntu-latest
    environment: specguard # the PAT lives here only; keep this environment restricted to protected branches (main) so only code from main sees the PAT/App secrets (a setting, not enforced here)
    timeout-minutes: 5
    permissions: { contents: read, pull-requests: read }
    env: # job env, not a step if:, because step conditions cannot read secrets
      HAVE_APP: ${{ secrets.SPECGUARD_APP_ID != '' && secrets.SPECGUARD_APP_PRIVATE_KEY != '' }}
    outputs:
      repo: ${{ steps.in.outputs.repo }}
      pr: ${{ steps.in.outputs.pr }}
      ref: ${{ steps.in.outputs.ref }}
      scan_paths: ${{ steps.in.outputs.scan_paths }}
      mode: ${{ steps.in.outputs.mode }}
      design: ${{ steps.in.outputs.design }}
      rules: ${{ steps.in.outputs.rules }}
      tests: ${{ steps.in.outputs.tests }}
      head_sha: ${{ steps.in.outputs.head_sha }}
      base_sha: ${{ steps.in.outputs.base_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - id: scope # the target repository for the App token
        if: env.HAVE_APP == 'true'
        shell: bash
        env:
          SPEC: ${{ inputs.target }}
        run: |
          spec="${SPEC//[[:space:]]/}"; spec="${spec#http*://*/}"; owner="${spec%%/*}"; name="${spec#*/}"; name="${name%%/*}"; name="${name%.git}"
          [[ "$spec" == */* && "$owner" =~ ^[A-Za-z0-9._-]+$ && "$name" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::cannot read owner/name from the target"; exit 1; }
          echo "owner=$owner" >> "$GITHUB_OUTPUT"; echo "name=$name" >> "$GITHUB_OUTPUT"
      - id: app
        if: env.HAVE_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SPECGUARD_APP_ID }}
          private-key: ${{ secrets.SPECGUARD_APP_PRIVATE_KEY }}
          owner: ${{ steps.scope.outputs.owner }}
          repositories: ${{ steps.scope.outputs.name }}
          permission-contents: read
          permission-pull-requests: read
      - id: in
        shell: bash
        env: # inputs reach the script as environment variables only, never as part of the shell text
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.SPECGUARD_PAT || github.token }}
          HAVE_PAT: ${{ secrets.SPECGUARD_PAT != '' }}
          TARGET: ${{ inputs.target }}
          DESIGN_DOCS: ${{ inputs.design_docs }}
          RULES_DOCS: ${{ inputs.rules_docs }}
          TEST_DIRS: ${{ inputs.test_dirs }}
        run: |
          [ "$HAVE_PAT" = true ] || [ "$HAVE_APP" = true ] || echo "::notice::neither the App secrets nor SPECGUARD_PAT is set in the specguard environment: using the job token, which reads only this repository and public repositories"
          node src/resolve-inputs.js # reads the PR (open only) and, with the token, the branch name and folders of the links
      - name: Refuse a non-public target when this repository is public # results (scan issue, summary, artifact) are written here
        shell: bash
        env:
          CONTROL_REPO: ${{ github.repository }}
          TARGET_REPO: ${{ steps.in.outputs.repo }}
          CONTROL_TOKEN: ${{ github.token }}
          TARGET_TOKEN: ${{ steps.app.outputs.token || secrets.SPECGUARD_PAT || github.token }}
        run: node src/visibility-guard.js # fails closed when a visibility cannot be read

  review:
    needs: resolve
    runs-on: ubuntu-latest
    environment: specguard
    timeout-minutes: 180 # a scan_scope all run makes up to ~85 sequential calls on a large repository (about 45 min); review_timeout_minutes below leaves 30 min for checkout, history fetch, verify and publish
    permissions: { contents: read, pull-requests: read, issues: write, copilot-requests: write } # issues write: the scan issue in THIS repository (scan_issue: specguard); the job token reaches no other repository
    env: # job env, not a step if:, because step conditions cannot read secrets
      HAVE_APP: ${{ secrets.SPECGUARD_APP_ID != '' && secrets.SPECGUARD_APP_PRIVATE_KEY != '' }}
    steps:
      - id: scope # the target repository for the App token
        if: env.HAVE_APP == 'true'
        shell: bash
        env:
          SPEC: ${{ needs.resolve.outputs.repo }}
        run: |
          spec="${SPEC//[[:space:]]/}"; spec="${spec#http*://*/}"; owner="${spec%%/*}"; name="${spec#*/}"; name="${name%%/*}"; name="${name%.git}"
          [[ "$spec" == */* && "$owner" =~ ^[A-Za-z0-9._-]+$ && "$name" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::cannot read owner/name from the target"; exit 1; }
          echo "owner=$owner" >> "$GITHUB_OUTPUT"; echo "name=$name" >> "$GITHUB_OUTPUT"
      - id: app
        if: env.HAVE_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SPECGUARD_APP_ID }}
          private-key: ${{ secrets.SPECGUARD_APP_PRIVATE_KEY }}
          owner: ${{ steps.scope.outputs.owner }}
          repositories: ${{ steps.scope.outputs.name }}
          permission-contents: read
          permission-pull-requests: ${{ inputs.post_to_pr && needs.resolve.outputs.mode == 'pr' && 'write' || 'read' }}
          permission-issues: ${{ needs.resolve.outputs.mode == 'scan' && inputs.scan_issue == 'target' && 'write' || 'read' }}
      # the target first, at the workspace root where the action works
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ needs.resolve.outputs.repo }}
          token: ${{ steps.app.outputs.token || secrets.SPECGUARD_PAT || github.token }}
          ref: ${{ needs.resolve.outputs.head_sha || needs.resolve.outputs.ref }}
          fetch-depth: ${{ needs.resolve.outputs.mode == 'scan' && 1 || 0 }} # PR reviews diff against the base blobs, so they keep the full clone
          filter: ${{ needs.resolve.outputs.mode == 'scan' && 'blob:none' || '' }}
          persist-credentials: false
      # Scans: full history of the checked-out commit only (no other branches, no tags, no blobs): the scan runs git log --since=180d and diffs against the last scanned head, and needs a non-shallow clone
      # (--shallow-since would stay shallow, so the history is skipped). The files at HEAD are already checked out; older blobs are never read. A last scanned head off this history degrades with a note.
      # Not fatal: without history the scan runs on the depth-1 checkout and says "no git history (shallow clone?)" (churn ranking off).
      - name: Fetch the history of the checked-out commit
        if: needs.resolve.outputs.mode == 'scan'
        shell: bash
        env:
          TOKEN: ${{ steps.app.outputs.token || secrets.SPECGUARD_PAT || github.token }}
        run: |
          h="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"; echo "::add-mask::$h"
          git -c "http.extraheader=AUTHORIZATION: basic $h" fetch --no-tags --filter=blob:none --unshallow origin "$(git rev-parse HEAD)" || echo "::warning::could not fetch the git history; churn ranking is off for this run"
      # SpecGuard itself beside it, in a path that must not exist yet: a reviewed repository that tracks a file, folder or symlink named .specguard-src cannot shadow the code that runs
      # with the token (the job fails instead). A checkout of the root would delete a folder created before the target. uses: cannot take an expression, and actions/checkout cannot
      # write outside the workspace, so the action runs from this path and its review ignores it (ignore below).
      - name: Refuse a target that already has .specguard-src
        shell: bash
        run: |
          if [ -e .specguard-src ] || [ -L .specguard-src ]; then echo "::error::the reviewed repository has a path named .specguard-src, which SpecGuard needs for itself"; exit 1; fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with: { path: .specguard-src, persist-credentials: false } # the dispatching commit (main only when the environment is restricted to main, see the requirement at the top)
      - id: head # scan mode: the reviewed commit, for source links in the summary
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # first line of the run summary (the scan appends its report after it): a manual scan runs once and keeps nothing, so no gap can be confirmed by a second run
      - if: needs.resolve.outputs.mode == 'scan' && inputs.scan_issue == 'none'
        shell: bash
        run: |
          echo '**One-off scan: gaps are unconfirmed; run it again with a scan issue (scan_issue: specguard or target) to confirm across runs.**' >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.specguard-src
        with:
          mode: ${{ needs.resolve.outputs.mode }}
          repository: ${{ needs.resolve.outputs.repo }}
          pr_number: ${{ needs.resolve.outputs.pr }}
          base_sha: ${{ needs.resolve.outputs.base_sha }}
          head_sha: ${{ needs.resolve.outputs.head_sha || steps.head.outputs.sha }}
          github_token: ${{ steps.app.outputs.token || secrets.SPECGUARD_PAT || github.token }}
          copilot_token: ${{ secrets.SPECGUARD_COPILOT_TOKEN }} # empty = Copilot runs on the job token (copilot-requests, org billing)
          # TEMPORARY test credential and model (the Copilot quota is used up): remove `|| secrets.SPEC` and the model pin when done.
          # llm_token wins over the Copilot alias above: a GitHub fine-grained PAT runs Copilot, an Anthropic API key (sk-ant-...) runs Claude Code (engine auto).
          llm_token: ${{ secrets.SPECGUARD_LLM_TOKEN || secrets.SPEC }}
          model: ${{ inputs.model }}
          max_budget_usd: ${{ inputs.max_budget_usd }}
          scan_scope: ${{ needs.resolve.outputs.mode == 'scan' && inputs.scan_scope || 'selected' }}
          review_timeout_minutes: ${{ needs.resolve.outputs.mode == 'scan' && inputs.scan_scope == 'all' && '150' || '12' }} # all: the dispatch deadline is this minus headroom, inside the 180-minute job timeout
          delivery: ${{ inputs.post_to_pr && needs.resolve.outputs.mode == 'pr' && 'pr' || 'summary' }}
          scan_paths: ${{ needs.resolve.outputs.mode == 'scan' && needs.resolve.outputs.scan_paths || '' }}
          requirements_paths: ${{ needs.resolve.outputs.design }}
          standards_paths: ${{ needs.resolve.outputs.rules }}
          test_paths: ${{ needs.resolve.outputs.tests }}
          ignore: .specguard-src/
          scan_issue: ${{ needs.resolve.outputs.mode == 'scan' && inputs.scan_issue != 'none' && 'true' || 'false' }}
          scan_issue_repo: ${{ needs.resolve.outputs.mode == 'scan' && inputs.scan_issue == 'specguard' && github.repository || '' }} # empty = the scanned repository (scan_issue: target, written with github_token)
          scan_issue_token: ${{ needs.resolve.outputs.mode == 'scan' && inputs.scan_issue == 'specguard' && github.token || '' }}
          force: "true"
          fail_on_error: "true" # a manual run that cannot complete (quota, auth, engine error) goes red; PR checks stay advisory
          include_bots: "true"
          ctx_retention_days: "0" # the context holds snippets of the target repository: no artifact
      # The results of the run, nothing else: the rendered summary, the findings, the requirement/obligation status and the usage. NOT the prompt files, the diff, repository files or the whole context dir.
      # These files quote the target repository, so this repository must stay private with access no wider than the targets' (same rule as the scan issue above).
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: specguard-result-${{ github.run_id }}
          path: |
            ${{ github.workspace }}/.specguard-ctx/summary.md
            ${{ github.workspace }}/.specguard-ctx/findings.json
            ${{ github.workspace }}/.specguard-ctx/requirements-status.json
            ${{ github.workspace }}/.specguard-ctx/audit.json
            ${{ github.workspace }}/.specguard-ctx/usage.json
            ${{ github.workspace }}/.specguard-ctx/scan-parts.json
          retention-days: 14
          if-no-files-found: ignore
          include-hidden-files: true # the ctx dir is a dot-directory, which upload-artifact skips by default
