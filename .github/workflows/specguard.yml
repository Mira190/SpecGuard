name: "SpecGuard reusable (called from target repos; no Run button here, use SpecGuard manual run)"
# Reusable workflow (on: workflow_call): runs SpecGuard against the CALLER's repository with the caller's GITHUB_TOKEN (repository access never needs a PAT). The caller writes ~10 lines (README: "Enterprise setup").
# Credential: pass the optional secret llm_token (a GitHub fine-grained PAT runs Copilot, an Anthropic API key sk-ant-... runs Claude Code; detected by prefix), or the copilot_token alias below.
# Copilot: pass the optional secret copilot_token (user-owned fine-grained PAT, Copilot Requests; billed to that user's seat) with `secrets: { copilot_token: ${{ secrets.SPECGUARD_COPILOT_TOKEN }} }`
# or `secrets: inherit` (then a caller secret named SPECGUARD_COPILOT_TOKEN is read). Without it Copilot runs on the job token, which needs the org policy "Allow use of Copilot CLI billed to the organization".
# github.* in here is always the caller's context (repository, event, token), so actions/checkout below checks out the caller's repository.
# Permissions: none declared on purpose. A called workflow can only keep or reduce what the caller job grants, so the caller job grants them (PR review: contents read, pull-requests write, issues read,
# copilot-requests write; scan: contents read, copilot-requests write, plus issues write with scan_issue).
# The action is used by a literal full-SHA pin (the `# specguard-pin` line below) (uses: cannot take an expression, and a GITHUB_TOKEN of the caller cannot be assumed to read this repository to check it
# out). The runner downloads it with its own scoped token, which is what the Access setting of an internal/private SpecGuard repository allows. After a change to action.yml or src/, run
# `node bin/pin-reusable.js` (pins the current commit) and commit; callers then pin the commit of this file. A test checks that the pin is a commit of this repository's history.
on:
  workflow_call:
    inputs:
      mode: { description: "pr (review the pull request) | scan (unit test gap scan; call it from workflow_dispatch or schedule on the default branch).", required: false, type: string, default: pr }
      requirements_paths: { description: "Globs (one per line) that add requirement documents; a !glob line excludes.", required: false, type: string, default: "" }
      standards_paths: { description: "Globs (one per line) that add coding-standard documents.", required: false, type: string, default: "" }
      test_paths: { description: "Globs or folders (one per line) that are the unit-test locations.", required: false, type: string, default: "" }
      scan_issue: { description: "Scan mode: also create or update the one scan issue (caller needs issues write).", required: false, type: boolean, default: false }
      model: { description: "Copilot model name. Empty = Copilot Auto.", required: false, type: string, default: "" }
      effort: { description: "Reasoning effort: low | medium | high | xhigh | max. Empty = Copilot default.", required: false, type: string, default: "" }
    secrets:
      llm_token: { description: "Optional. A GitHub fine-grained PAT (Copilot Requests) or an Anthropic API key (sk-ant-...), detected by prefix; wins over copilot_token.", required: false }
      copilot_token: { description: "Optional. Fine-grained PAT owned by a user, account permission Copilot Requests; Copilot is then billed to that user's seat. Empty = the job token (needs the org policy 'Allow use of Copilot CLI billed to the organization').", required: false }

jobs:
  specguard:
    # a fork or draft PR is skipped (a fork's token is read-only and its code is untrusted); a scan has no PR
    if: ${{ inputs.mode != 'pr' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: Mira190/SpecGuard@33a3c75f9fbbaffa0b3143a5f2a28ab17de6913d # specguard-pin
        with:
          mode: ${{ inputs.mode }}
          github_token: ${{ github.token }}
          llm_token: ${{ secrets.llm_token || secrets.SPECGUARD_LLM_TOKEN }} # explicit "secrets: { llm_token: ... }", or "secrets: inherit" with a secret of that name
          copilot_token: ${{ secrets.copilot_token || secrets.SPECGUARD_COPILOT_TOKEN }} # explicit "secrets: { copilot_token: ... }", or "secrets: inherit" with a secret of that name
          requirements_paths: ${{ inputs.requirements_paths }}
          standards_paths: ${{ inputs.standards_paths }}
          test_paths: ${{ inputs.test_paths }}
          scan_issue: ${{ inputs.scan_issue }}
          model: ${{ inputs.model }}
          effort: ${{ inputs.effort }}
          review_timeout_minutes: ${{ inputs.mode == 'scan' && '25' || '12' }}
          copilot_max_ai_credits: ${{ inputs.mode == 'scan' && '400' || '60' }}
